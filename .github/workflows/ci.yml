name: CI

# PR 與合併到 main 後都會執行（對應 kickoff：lint / test / build）
on:
  pull_request:
  push:
    branches: [main]

jobs:
  lint-test:
    name: Lint & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: lint-test
    steps:
      - uses: actions/checkout@v4
      - name: 建置映像檔（不推送）
        run: docker build -t runner-api:ci .
